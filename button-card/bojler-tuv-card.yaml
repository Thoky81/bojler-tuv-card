type: custom:button-card
entity: sensor.bojler_temp_tuv_bojler
show_name: false
show_icon: false
show_state: false
triggers_update:
- sensor.bojler_temp_tuv_bojler
- sensor.tuv_sensors_tuv_pipe_near
- sensor.bojler_temp_tuv_pipe
- sensor.tuv_sensors_tuv_pipe_near_2
- switch.tuv_bojler_valve
- switch.bojler
- sensor.bojler_power
- binary_sensor.d1_mini_v4_switchboard_hdo_tarif_relay
- sensor.power_tariff_times
tap_action:
  action: none
hold_action:
  action: none
styles:
  card:
  - padding: 16px
  - border-radius: 12px
  grid:
  - grid-template-areas: '"main"'
  - grid-template-columns: 1fr
  custom_fields:
    main:
    - width: 100%
custom_fields:
  main: |
    [[[
    // ---------- translations (language: auto = Home Assistant's language, sk, cs, en) ----------
    const I18N = {
      sk: {
        title: 'Bojler', BOILER: 'BOJLER', boiler: 'bojler',
        supply: 'PRÍVOD', coil_in: 'DO BOJLERA', coil_out: 'SPIATOČKA',
        hot_water: 'TEPLÁ VODA', cold_water: 'STUDENÁ VODA',
        open: 'otvorený', closed: 'zatvorený', unavailable: 'nedostupný', valve: 'ventil', valve_q: 'VENTIL ?',
        valve_unavailable: 'ventil nedostupný', el_badge: '⚡ elektrina',
        na: 'nedostupné', na_txt: 'Teplotné senzory sú nedostupné',
        bad: 'bojler kúri radiátory',
        bad_txt: (tin, tb) => `Ventil je otvorený, ale voda z kúrenia (${tin}) je chladnejšia ako bojler (${tb}). Bojler ohrieva radiátory.`,
        tuv: 'ohrev z kúrenia', tuv_txt: d => 'Kúrenie ohrieva bojler' + (d !== null ? ` · výmenník odovzdáva ${d.toFixed(1)}°` : ''),
        ready: 'kúrenie je teplé', ready_txt: d => `Prívod je o ${d.toFixed(1)}° teplejší ako bojler, ventil by mohol otvoriť`,
        el: 'elektrický ohrev', el_txt: colder => `Ohrieva elektrina · kúrenie je ${colder ? 'chladnejšie ako bojler' : 'málo teplé'}`,
        idle: 'pohotovosť',
        idle_txt: d => d === null ? 'Ventil zatvorený' : `Ventil zatvorený · prívod je ${d >= 0 ? 'len o ' + d.toFixed(1) + '° teplejší' : 'o ' + (-d).toFixed(1) + '° chladnejší'} ako bojler`,
        s_sup: 'prívod − bojler', s_coil: 'výmenník Δ', s_el: 'elektrina', el_on: 'zapnutá', el_off: 'vypnutá',
        coil_only_open: 'len pri otvorenom ventile',
        just_now: 'práve',
        hist: 'HISTÓRIA', hist_now: 'teraz', c_heat: 'ohrev z kúrenia', c_el: 'elektrina', c_kwh: 'spotreba elektriny',
        c_rev: 'bojler kúril radiátory', h_heat: 'kúrenie', h_el: 'elektrina', h_valve: 'ventil', h_element: 'špirála',
        loading: 'Načítavam históriu…', hist_err: 'História nie je dostupná: ',
        pick: 'Vyber entitu bojlera (teplota) a ventilu v editore karty.',
        sw_on: 'ZAP', sw_off: 'VYP', sw_off_label: 'špirála vypnutá', sw_off_txt: 'Elektrická špirála je vypnutá vypínačom',
        until: 'do', nt: 'NT', vt: 'VT', nt_long: 'nízky tarif', vt_long: 'vysoký tarif',
        blocked: 'vysoký tarif', blocked_txt: 'Vysoký tarif: elektrická špirála je vypnutá',
      },
      cs: {
        title: 'Bojler', BOILER: 'BOJLER', boiler: 'bojler',
        supply: 'PŘÍVOD', coil_in: 'DO BOJLERU', coil_out: 'ZPÁTEČKA',
        hot_water: 'TEPLÁ VODA', cold_water: 'STUDENÁ VODA',
        open: 'otevřený', closed: 'zavřený', unavailable: 'nedostupný', valve: 'ventil', valve_q: 'VENTIL ?',
        valve_unavailable: 'ventil nedostupný', el_badge: '⚡ elektřina',
        na: 'nedostupné', na_txt: 'Teplotní senzory jsou nedostupné',
        bad: 'bojler topí radiátory',
        bad_txt: (tin, tb) => `Ventil je otevřený, ale voda z topení (${tin}) je chladnější než bojler (${tb}). Bojler ohřívá radiátory.`,
        tuv: 'ohřev z topení', tuv_txt: d => 'Topení ohřívá bojler' + (d !== null ? ` · výměník předává ${d.toFixed(1)}°` : ''),
        ready: 'topení je teplé', ready_txt: d => `Přívod je o ${d.toFixed(1)}° teplejší než bojler, ventil by mohl otevřít`,
        el: 'elektrický ohřev', el_txt: colder => `Ohřívá elektřina · topení je ${colder ? 'chladnější než bojler' : 'málo teplé'}`,
        idle: 'pohotovost',
        idle_txt: d => d === null ? 'Ventil zavřený' : `Ventil zavřený · přívod je ${d >= 0 ? 'jen o ' + d.toFixed(1) + '° teplejší' : 'o ' + (-d).toFixed(1) + '° chladnější'} než bojler`,
        s_sup: 'přívod − bojler', s_coil: 'výměník Δ', s_el: 'elektřina', el_on: 'zapnutá', el_off: 'vypnutá',
        coil_only_open: 'jen při otevřeném ventilu',
        just_now: 'právě',
        hist: 'HISTORIE', hist_now: 'teď', c_heat: 'ohřev z topení', c_el: 'elektřina', c_kwh: 'spotřeba elektřiny',
        c_rev: 'bojler topil radiátory', h_heat: 'topení', h_el: 'elektřina', h_valve: 'ventil', h_element: 'spirála',
        loading: 'Načítám historii…', hist_err: 'Historie není dostupná: ',
        pick: 'Vyberte entitu teploty bojleru a ventil v editoru karty.',
        sw_on: 'ZAP', sw_off: 'VYP', sw_off_label: 'spirála vypnutá', sw_off_txt: 'Elektrická spirála je vypnutá vypínačem',
        until: 'do', nt: 'NT', vt: 'VT', nt_long: 'nízký tarif', vt_long: 'vysoký tarif',
        blocked: 'vysoký tarif', blocked_txt: 'Vysoký tarif: elektrická spirála je vypnutá',
      },
      en: {
        title: 'Boiler', BOILER: 'BOILER', boiler: 'boiler',
        supply: 'SUPPLY', coil_in: 'TO BOILER', coil_out: 'RETURN',
        hot_water: 'HOT WATER', cold_water: 'COLD WATER',
        open: 'open', closed: 'closed', unavailable: 'unavailable', valve: 'valve', valve_q: 'VALVE ?',
        valve_unavailable: 'valve unavailable', el_badge: '⚡ electric',
        na: 'unavailable', na_txt: 'Temperature sensors are unavailable',
        bad: 'boiler heats radiators',
        bad_txt: (tin, tb) => `The valve is open, but the heating water (${tin}) is colder than the boiler (${tb}). The boiler is heating the radiators.`,
        tuv: 'heated by heating', tuv_txt: d => 'The heating is warming the boiler' + (d !== null ? ` · the coil passes on ${d.toFixed(1)}°` : ''),
        ready: 'heating is warm', ready_txt: d => `The supply is ${d.toFixed(1)}° warmer than the boiler, the valve could open`,
        el: 'electric heating', el_txt: colder => `Electricity is heating · the heating water is ${colder ? 'colder than the boiler' : 'not warm enough'}`,
        idle: 'standby',
        idle_txt: d => d === null ? 'Valve closed' : `Valve closed · the supply is ${d >= 0 ? 'only ' + d.toFixed(1) + '° warmer' : (-d).toFixed(1) + '° colder'} than the boiler`,
        s_sup: 'supply − boiler', s_coil: 'coil Δ', s_el: 'electricity', el_on: 'on', el_off: 'off',
        coil_only_open: 'only while the valve is open',
        just_now: 'now',
        hist: 'HISTORY', hist_now: 'now', c_heat: 'heated by heating', c_el: 'electricity', c_kwh: 'electricity used',
        c_rev: 'boiler heated radiators', h_heat: 'heating', h_el: 'electricity', h_valve: 'valve', h_element: 'element',
        loading: 'Loading history…', hist_err: 'History is not available: ',
        pick: 'Pick the boiler temperature and the valve in the card editor.',
        sw_on: 'ON', sw_off: 'OFF', sw_off_label: 'element off', sw_off_txt: 'The electric element is switched off',
        until: 'until', nt: 'off-peak', vt: 'peak', nt_long: 'off-peak tariff', vt_long: 'peak tariff',
        blocked: 'peak tariff', blocked_txt: 'Peak tariff: the electric element is switched off',
      },
    };
    // optional tariff entity: true = low tariff, false = high tariff, null = no tariff / unknown.
    // tariff_low lists the states that mean low tariff (comma-separated, case-insensitive)
    const isLowTariff = (state, lowList) => {
      if (state === undefined || state === null || ['unknown', 'unavailable', ''].includes(state)) return null;
      return String(lowList || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean).includes(String(state).toLowerCase());
    };
    const i18nLang = (language, haLang) => {
      const l = String((language && language !== 'auto' ? language : haLang) || 'sk').slice(0, 2);
      return I18N[l] ? l : 'en';
    };
    // custom label if the user set one, otherwise the default of the current language
    // (a saved default from any language counts as "not set", so switching language translates it)
    const i18nText = (cfg, key, cfgKey) => {
      const v = cfg[cfgKey], T = I18N[cfg.lang || 'sk'];
      return v && !Object.values(I18N).some(t => t[key] === v) ? v : T[key];
    };

    const C = {"title": "", "language": "auto", "boiler": "sensor.bojler_temp_tuv_bojler", "supply": "sensor.tuv_sensors_tuv_pipe_near", "coil_in": "sensor.bojler_temp_tuv_pipe", "coil_out": "sensor.tuv_sensors_tuv_pipe_near_2", "valve": "switch.tuv_bojler_valve", "heater": "switch.bojler", "heater_power": "sensor.bojler_power", "heater_on_w": 50, "tariff": "binary_sensor.d1_mini_v4_switchboard_hdo_tarif_relay", "tariff_until": "sensor.power_tariff_times", "tariff_low": "off", "label_supply": "", "label_coil_in": "", "label_coil_out": "", "cold": 0, "hot": 80, "min_delta": 3, "reverse_tol": 0.5, "animate": true, "layout": "auto", "show_header": true, "show_stats": true, "show_banner": true, "show_graph": true, "graph_hours": 24, "graph_smooth": 20, "graph_power": false};
    const LANG = C.lang || i18nLang(C.language, typeof hass !== 'undefined' && hass ? hass.language : '');
    const T = I18N[LANG], CL = { ...C, lang: LANG };
    const lbl = k => i18nText(CL, k, 'label_' + k);
    const TITLE = i18nText(CL, 'title', 'title');
    const U = C.uid || 'bt';  // constant: each button-card has its own shadow root
    const ok = s => s && !['unknown','unavailable'].includes(s.state);
    const num = id => { if (!id) return null; const s = states[id]; if (!ok(s)) return null; const v = parseFloat(s.state); return isNaN(v) ? null : v; };
    const isOn = id => { const s = id && states[id]; return !!s && ['on','open','opening'].includes(s.state); };
    const hl = t => {
      const k = Math.max(0, Math.min(1, (t - C.cold) / (C.hot - C.cold)));
      return [Math.round(215 - 215 * k), Math.round(50 - 7 * Math.sin(Math.PI * k))];
    };
    const tc = t => {
      if (t === null) return 'var(--disabled-text-color, #9e9e9e)';
      const [h, l] = hl(t);
      return `hsl(${h},78%,${l}%)`;
    };
    // text on a pill filled with tc(t): white or near-black, whichever has more contrast
    const ink = t => {
      if (t === null) return '#fff';
      const [h, l] = hl(t), L = l / 100, a = .78 * Math.min(L, 1 - L);
      const ch = n => {
        const k = (n + h / 30) % 12, v = L - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
      };
      const Y = .2126 * ch(0) + .7152 * ch(8) + .0722 * ch(4);
      return 1.05 / (Y + .05) >= (Y + .05) / .0625 ? '#fff' : '#1b1b1b';
    };
    const f = v => v === null ? '—' : v.toFixed(1) + '°';
    const sg = v => v === null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '°';
    const ago = ts => {
      if (!ts) return '';
      const m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
      return m < 1 ? T.just_now : m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h` : `${Math.floor(m / 1440)} d`;
    };
    const mi = id => id ? `class="bt-click" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${id}'}}))"` : '';
    const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, transparent)`;

    const tb = num(C.boiler), t1 = num(C.supply), t2 = num(C.coil_in), t3 = num(C.coil_out);
    const vS = states[C.valve];
    const vOk = ok(vS);
    const open = isOn(C.valve);
    // power as the sensor reports it (value + its own unit); pw is converted to W for the threshold
    const pwUnit = (C.heater_power && states[C.heater_power]?.attributes?.unit_of_measurement) || 'W';
    const pwRaw = num(C.heater_power);
    const pw = pwRaw === null ? null : pwRaw * ({ kW: 1e3, MW: 1e6 }[pwUnit] || 1);
    const pwTxt = pwRaw === null ? '' : `${pwUnit === 'W' ? Math.round(pwRaw) : +pwRaw.toFixed(2)} ${pwUnit}`;
    const hasHeater = !!(C.heater || C.heater_power);
    // heating comes from the power reading when there is one; the switch alone only says the element is enabled
    const heating = pw !== null ? pw > C.heater_on_w : !!(C.heater && isOn(C.heater));
    const elOn = C.heater && ok(states[C.heater]) ? isOn(C.heater) : null;  // null = no switch configured
    const lowT = C.tariff ? isLowTariff(states[C.tariff]?.state, C.tariff_low) : null;  // null = single tariff / unknown
    // optional sensor telling when the tariff changes: any text with a time ("Vysoky Tarif do 16:55") or a timestamp
    const tUntil = (() => {
      const s = C.tariff_until && states[C.tariff_until];
      if (!ok(s)) return '';
      const m = String(s.state).match(/\b(\d{1,2}:\d{2})\b/);
      if (m && !/^\d{4}-/.test(s.state)) return m[1];
      const t = Date.parse(s.state);
      return isFinite(t) ? new Date(t).toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit', hour12: C.hour12 }) : '';
    })();
    const untilTxt = tUntil ? ` ${T.until} ${tUntil}` : '';
    const tin = t2 !== null ? t2 : t1;
    const dSup = t1 !== null && tb !== null ? t1 - tb : null;
    const dIn = tin !== null && tb !== null ? tin - tb : null;
    const dCoil = t2 !== null && t3 !== null ? t2 - t3 : null;

    const SUC = 'var(--success-color, #43a047)', ERR = 'var(--error-color, #db4437)', WRN = 'var(--warning-color, #ffa600)';
    const INF = 'var(--info-color, #039be5)', SEC = 'var(--secondary-text-color, #727272)';
    let st;
    if (tb === null || tin === null) st = { k: 'na', c: SEC, icon: 'mdi:lan-disconnect', label: T.na, txt: T.na_txt };
    else if (open && dIn < -C.reverse_tol) st = { k: 'bad', c: ERR, icon: 'mdi:alert', label: T.bad, txt: T.bad_txt(f(tin), f(tb)) };
    else if (open) st = { k: 'tuv', c: SUC, icon: 'mdi:check-circle', label: T.tuv, txt: T.tuv_txt(dCoil) };
    else if (dSup !== null && dSup >= C.min_delta) st = { k: 'ready', c: INF, icon: 'mdi:information', label: T.ready, txt: T.ready_txt(dSup) };
    else if (heating) st = { k: 'el', c: WRN, icon: 'mdi:flash', label: T.el, txt: T.el_txt(dSup !== null && dSup < 0) };
    else if (elOn === false) st = { k: 'off', c: SEC, icon: 'mdi:power-off', label: T.sw_off_label, txt: T.sw_off_txt };
    else if (lowT === false) st = { k: 'blocked', c: SEC, icon: 'mdi:power-plug-off', label: T.blocked + untilTxt, txt: T.blocked_txt + untilTxt };
    else st = { k: 'idle', c: SEC, icon: 'mdi:power-sleep', label: T.idle, txt: T.idle_txt(dSup) };

    const pill = (txt, c, tip = '') => `<span ${tip ? `title="${tip}"` : ''} style="font-size:12px;padding:4px 10px;border-radius:7px;font-weight:500;white-space:nowrap;background:${tint(c, 15)};color:${c}">${txt}</span>`;
    let pills = '';
    if (!vOk) pills += pill(T.valve_unavailable, SEC);
    if (heating && st.k !== 'el') pills += pill(T.el_badge, WRN);
    if (lowT !== null && st.k !== 'blocked') pills += pill((lowT ? T.nt : T.vt) + untilTxt, lowT ? INF : SEC, (lowT ? T.nt_long : T.vt_long) + untilTxt);
    pills += pill(st.label, st.c);


    const cB = tc(tb), c1 = tc(t1), c2 = tc(t2), c3 = tc(t3);
    const vCol = !vOk ? SEC : open ? SUC : SEC;
    const vTxt = !vOk ? T.unavailable : open ? T.open : T.closed;
    const dCol = !open || dCoil === null ? SEC : dCoil >= 0 ? SUC : ERR;
    const supCol = dSup === null ? SEC : dSup >= C.min_delta ? SUC : dSup >= 0 ? WRN : ERR;
    const flowCol = st.k === 'bad' ? ERR : '#fff';
    const CARD_BG = 'var(--ha-card-background, var(--card-background-color, #fff))';
    const scaleGrad = dir => `linear-gradient(${dir}, ${[0, .25, .5, .75, 1].map(k => tc(C.cold + k * (C.hot - C.cold))).join(', ')})`;
    const pct = v => Math.max(0, Math.min(100, (v - C.cold) / (C.hot - C.cold) * 100));
    const flow = d => open ? `<path d="${d}" class="bt-flow" style="fill:none;stroke:${flowCol};stroke-opacity:.75;stroke-width:2;stroke-linecap:round"/>` : '';
    // Perf: CSS-only animation, stepped to ~7 repaints/s (Safari repaints SVG dash animation every frame), off with animate: false
    const STYLE = `
    <style>
      .bt-click { cursor: pointer; }
      .bt-click:hover { opacity: .75; }
      .bt-flow { stroke-dasharray: 4 10; ${C.animate ? `animation: btf${U} 1s steps(7) infinite;` : ''} }
      @keyframes btf${U} { to { stroke-dashoffset: -14; } }
      @media (prefers-reduced-motion: reduce) { .bt-flow { animation: none; } }
    </style>`;
    const header = (extra = '') => `
      <div style="display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--divider-color)">
        <ha-icon icon="mdi:water-boiler" style="--mdc-icon-size:18px;color:${st.c};flex-shrink:0"></ha-icon>
        <span style="font-size:15px;font-weight:500">${TITLE}</span>${extra}
        <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${pills}</span>
      </div>`;
    const banner = () => `
      <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:${tint(st.c, 12)};color:${st.c}">
        <ha-icon icon="${st.icon}" style="--mdc-icon-size:18px;flex-shrink:0"></ha-icon>
        <span style="font-size:12.5px;line-height:1.35;color:${st.k === 'idle' || st.k === 'na' ? SEC : 'var(--primary-text-color)'}">${st.txt}</span>
      </div>`;
    const wrap = inner => `${STYLE}<div style="display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--primary-text-color)">${inner}</div>`;
    // temperature pill on a pipe: filled with the temperature color, label above or below
    const tBadge = (x, y, v, id, label, ly) => `
      <g ${mi(id)}>
        <text x="${x}" y="${ly}" text-anchor="middle" style="font-size:9px;letter-spacing:.8px;font-weight:600;fill:${SEC}">${label}</text>
        <rect x="${x - 29}" y="${y - 12}" width="58" height="24" rx="12" style="fill:${tc(v)};stroke:${CARD_BG};stroke-width:2"/>
        <text x="${x}" y="${y + 4.8}" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:${ink(v)};font-variant-numeric:tabular-nums">${f(v)}</text>
      </g>`;

    // ---------- schematic ----------
    // electric element: the rod glows orange while heating; the icon above the flange shows the switch
    // (power icon: grey = off, green = on, orange = heating) or, without a switch entity, a lightning bolt.
    // Its text sits to the right of the icon, away from the "cold water" label.
    const swOn = elOn === true, swKnown = elOn !== null;
    const ICON_AT = 'translate(327 155)';
    const BOLT = 'M7,2V13H10V22L17,10H13L17,2H7Z';
    const POWER = 'M16.56,5.44L15.11,6.89C16.84,7.94 18,9.83 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12C6,9.83 7.16,7.94 8.88,6.88L7.44,5.44C5.36,6.88 4,9.28 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12C20,9.28 18.64,6.88 16.56,5.44M13,3H11V13H13';
    const elIconCol = heating ? WRN : swOn ? SUC : SEC;
    const elIcon = swKnown ? `<path d="${POWER}" transform="${ICON_AT}" style="fill:${elIconCol};fill-opacity:${swOn || heating ? 1 : .55}"/>`
      : hasHeater ? `<path d="${BOLT}" transform="${ICON_AT}" style="fill:${heating ? WRN : SEC};fill-opacity:${heating ? 1 : .5}"/>` : '';
    let elText = null;  // [text, color, tooltip]
    if (pw !== null && heating) elText = [pwTxt, WRN];
    else if (swKnown) elText = [(swOn ? T.sw_on : T.sw_off) + (lowT === false ? ' · ' + T.vt.toUpperCase() : ''), swOn ? SUC : SEC, lowT === false ? T.vt_long : ''];
    else if (lowT === false) elText = [T.vt.toUpperCase(), SEC, T.vt_long];

    const SY = 124, RY = 166, VX = 112, TX = 168, WALL = 214;
    const dim = open ? 1 : 0.4;
    const coil = `M${WALL} ${SY} H292 a7 7 0 0 1 0 14 H240 a7 7 0 0 0 0 14 H292 a7 7 0 0 1 0 14 H${WALL}`;

    const svg = `
    <svg viewBox="0 0 400 244" style="width:100%;height:auto;display:block;overflow:visible">
      <defs>
        <linearGradient id="w${U}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:${tc(tb === null ? null : tb + 3)}"/>
          <stop offset="1" style="stop-color:${tc(tb === null ? null : tb - 12)}"/>
        </linearGradient>
        <linearGradient id="c${U}" gradientUnits="userSpaceOnUse" x1="0" y1="${SY}" x2="0" y2="${RY}">
          <stop offset="0" style="stop-color:${c2}"/><stop offset="1" style="stop-color:${c3}"/>
        </linearGradient>
      </defs>

      <!-- hot / cold water -->
      <path d="M266 18 V8 H392" style="fill:none;stroke:${cB};stroke-width:5;stroke-linecap:round;stroke-opacity:.55"/>
      <text x="392" y="24" text-anchor="end" style="font-size:8.5px;letter-spacing:1px;font-weight:600;fill:${SEC}">${T.hot_water}</text>
      <path d="M266 226 V236 H392" style="fill:none;stroke:${tc(C.cold)};stroke-width:5;stroke-linecap:round;stroke-opacity:.7"/>
      <text x="392" y="228" text-anchor="end" style="font-size:8.5px;letter-spacing:1px;font-weight:600;fill:${SEC}">${T.cold_water}</text>

      <!-- tank -->
      <g ${mi(C.boiler)}>
        <rect x="${WALL}" y="18" width="104" height="208" rx="40" style="fill:url(#w${U});fill-opacity:.2;stroke:${st.k === 'bad' ? ERR : SEC};stroke-opacity:${st.k === 'bad' ? 1 : .35};stroke-width:3"/>
        <text x="266" y="62" text-anchor="middle" style="font-size:9px;letter-spacing:1.5px;font-weight:600;fill:${SEC}">${T.BOILER}</text>
        <text x="266" y="96" text-anchor="middle" style="font-size:30px;font-weight:500;fill:${cB};font-variant-numeric:tabular-nums">${tb === null ? '—' : tb.toFixed(1)}<tspan style="font-size:16px" dy="-11">°C</tspan></text>
      </g>

      <!-- coil -->
      <path d="${coil}" style="fill:none;stroke:url(#c${U});stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:${open ? 1 : .5}"/>
      ${flow(coil)}

      <!-- electric element -->
      <g ${mi(C.heater || C.heater_power)}>
        ${heating ? `<path d="M318 192 H246 a5 5 0 0 0 0 10 H318" style="fill:none;stroke:${WRN};stroke-opacity:.25;stroke-width:9;stroke-linecap:round"/>` : ''}
        <path d="M318 192 H246 a5 5 0 0 0 0 10 H318" style="fill:none;stroke:${heating ? WRN : SEC};stroke-opacity:${heating ? 1 : .45};stroke-width:3;stroke-linecap:round"/>
        <rect x="315" y="186" width="9" height="22" rx="2" style="fill:${SEC};fill-opacity:.5"/>
        ${elIcon}
        ${elText ? `<text x="350" y="171" style="font-size:9.5px;font-weight:600;fill:${elText[1]}">${elText[2] ? `<title>${elText[2]}</title>` : ''}${elText[0]}</text>` : ''}
      </g>

      <!-- heating circuit -->
      <g style="fill:${SEC};fill-opacity:.55">
        <rect x="2" y="134" width="4" height="22" rx="2"/><rect x="8" y="134" width="4" height="22" rx="2"/><rect x="14" y="134" width="4" height="22" rx="2"/>
      </g>
      <path d="M10 134 V${SY} H${VX}" style="fill:none;stroke:${c1};stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/>
      <path d="M${VX} ${SY} H${WALL}" style="fill:none;stroke:${c2};stroke-width:6;stroke-linecap:round;opacity:${dim}"/>
      <path d="M${WALL} ${RY} H10 V156" style="fill:none;stroke:${c3};stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:${dim}"/>
      ${flow(`M10 134 V${SY} H${WALL}`)}
      ${flow(`M${WALL} ${RY} H10 V156`)}

      <!-- valve -->
      <g ${mi(C.valve)}>
        <rect x="${VX - 9}" y="94" width="18" height="12" rx="2.5" style="fill:${vCol};fill-opacity:${open ? 1 : .55}"/>
        <rect x="${VX - 1}" y="106" width="2" height="9" style="fill:${vCol}"/>
        <path d="M${VX - 12} 114 L${VX} ${SY} L${VX - 12} 134 Z M${VX + 12} 114 L${VX} ${SY} L${VX + 12} 134 Z" style="fill:${vCol};fill-opacity:${open ? 1 : .55};stroke:${CARD_BG};stroke-width:1.5;stroke-linejoin:round"/>
        <text x="${VX}" y="151" text-anchor="middle" style="font-size:8.5px;letter-spacing:1px;font-weight:600;fill:${vCol}">${!vOk ? T.valve_q : vTxt.toUpperCase()}</text>
      </g>

      ${tBadge(52, SY, t1, C.supply, lbl('supply'), 105)}
      ${tBadge(TX, SY, t2, C.coil_in, lbl('coil_in'), 105)}
      ${tBadge(TX, RY, t3, C.coil_out, lbl('coil_out'), 193)}
      ${open ? `<text x="${TX}" y="149" text-anchor="middle" style="font-size:10px;font-weight:600;fill:${dCol};font-variant-numeric:tabular-nums"><title>${lbl('coil_in').toLowerCase()} ${f(t2)} − ${lbl('coil_out').toLowerCase()} ${f(t3)}</title>Δ ${sg(dCoil)}</text>` : ''}
    </svg>`;

    // ---------- stats ----------
    const cell = (label, val, col, id, tip = '') => `
      <div ${mi(id)} ${tip ? `title="${tip}"` : ''} style="min-width:0">
        <div style="font-size:11px;color:${SEC};white-space:nowrap">${label}</div>
        <div style="font-size:15px;font-weight:500;color:${col};white-space:nowrap;font-variant-numeric:tabular-nums">${val}</div>
      </div>`;
    let cells = cell(T.boiler, f(tb), cB, C.boiler)
      + cell(T.s_sup, sg(dSup), supCol, C.supply, `${lbl('supply').toLowerCase()} ${f(t1)} − ${T.boiler} ${f(tb)}`)
      // with the valve closed the water in the coil stands still, so in − out says nothing
      + cell(T.s_coil, open ? sg(dCoil) : '—', dCol, C.coil_in,
        open ? `${lbl('coil_in').toLowerCase()} ${f(t2)} − ${lbl('coil_out').toLowerCase()} ${f(t3)}` : T.coil_only_open)
      + cell(vOk ? `${T.valve} · ${ago(vS.last_changed)}` : T.valve, vTxt, vCol, C.valve);
    const elLbl = T.s_el + (lowT === null ? '' : ` · ${lowT ? T.nt : T.vt}`);
    if (pw !== null) cells += cell(elLbl, pwTxt, heating ? WRN : SEC, C.heater_power, C.heater_power);
    else if (C.heater) cells += cell(elLbl, heating ? T.el_on : T.el_off, heating ? WRN : SEC, C.heater);

    return wrap(`
      ${C.show_header !== false ? header() : ''}
      ${svg}
      ${C.show_stats !== false ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--divider-color)">${cells}</div>` : ''}
      ${C.show_banner !== false ? banner() : ''}`);
    ]]]
